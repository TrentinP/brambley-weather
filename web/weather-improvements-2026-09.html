<!-- Brambley Weather Station improvements, 2026-09. Paste in a Code Block immediately BELOW the main weather-station block. -->
<style>
/* Put Rain today and Rain rate together in the Weather Station grid. */
#brambley-weather .brw-metrics .brw-rainrate-box{grid-column:auto}
/* Compact intraday instruments. */
#brambley-weather .brw-todaycharts{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:15px;max-width:920px}
#brambley-weather .brw-mini-chart{border:1px solid #cbc9bf;padding:18px;min-width:0}
#brambley-weather .brw-mini-chart small{display:block;color:#4f6238!important;font-size:12px;letter-spacing:.14em;font-weight:800;margin-bottom:3px}
#brambley-weather .brw-mini-chart h4{font-size:20px;margin:0 0 10px;font-weight:400;color:#292b27}
#brambley-weather .brw-mini-canvas{height:155px;position:relative}
#brambley-weather .brw-solar .brw-subhead small{color:#4f6238!important;opacity:1!important}
#brambley-weather .brw-seasonal{margin-top:0;padding-top:0;border-top:0;margin-bottom:30px}
#brambley-weather .brw-seasonal>.brw-subhead{display:none!important}
#brambley-weather .brw-solarhistory{margin-top:0;padding-top:30px}
@media(max-width:800px){#brambley-weather .brw-todaycharts{grid-template-columns:1fr;max-width:none}}
</style>
<script>
(async()=>{
const root=document.getElementById('brambley-weather'); if(!root||!window.Chart)return;
const $=id=>document.getElementById(id), RAW='https://raw.githubusercontent.com/TrentinP/brambley-weather/main/';
const num=v=>v==null||v===''?null:(Number.isFinite(Number(v))?Number(v):null);
async function text(path){const r=await fetch(RAW+path+'?v='+Date.now());if(!r.ok)throw Error(path);return r.text()}
function csv(s){const [h,...rs]=s.trim().split(/\r?\n/).map(x=>x.split(','));return rs.map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]])))}
function clock(s){return new Date(s).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/Los_Angeles'})}

/* Current card: retain daily total and place instantaneous rainfall rate immediately after it. */
try{
 const d=JSON.parse(await text('data/current.json')),m=d.measurements||{}; const rain=$('brw-rain');
 if(rain){rain.parentElement.querySelector('small').textContent='Rain today';rain.textContent=(num(m.rain_daily_mm)??0).toFixed(1)+' mm';}
 const metrics=root.querySelector('.brw-metrics');
 if(metrics&&!$('brw-rainrate')){
   const box=document.createElement('div');box.className='brw-rainrate-box';box.innerHTML='<small>Rain rate</small><b id="brw-rainrate">'+(num(m.rain_rate_mm_hr)??0).toFixed(1)+' mm/hr</b>';
   if(rain?.parentElement) rain.parentElement.after(box); else metrics.appendChild(box);
 }
}catch(e){console.error('Brambley rain rate:',e)}

/* Today at Brambley: temperature plus compact rainfall-rate and barograph charts. */
const cards=root.querySelector('.brw-cards');
if(cards){const articles=[...cards.querySelectorAll('article')];articles.slice(1).forEach(a=>a.remove());cards.style.gridTemplateColumns='1fr';
 const wrap=document.createElement('div');wrap.className='brw-todaycharts';wrap.innerHTML='<div class="brw-mini-chart"><small>RAINFALL RATE</small><h4>Rain through the day</h4><div class="brw-mini-canvas"><canvas id="brw-rainrate-chart"></canvas></div></div><div class="brw-mini-chart"><small>BAROGRAPH</small><h4>Pressure through the day</h4><div class="brw-mini-canvas"><canvas id="brw-pressure-chart"></canvas></div></div>';cards.after(wrap);
}
try{
 const now=new Date(),ym=now.toLocaleDateString('en-CA',{timeZone:'America/Los_Angeles'}).slice(0,7),today=now.toLocaleDateString('en-CA',{timeZone:'America/Los_Angeles'});
 const rows=csv(await text('data/observations/'+ym+'.csv')).filter(r=>(r.timestamp_local||'').slice(0,10)===today);const labels=rows.map(r=>clock(r.timestamp_local));
 new Chart($('brw-rainrate-chart'),{type:'line',data:{labels,datasets:[{data:rows.map(r=>num(r.rain_rate_mm_hr)),borderColor:'#55728a',backgroundColor:'rgba(85,114,138,.12)',fill:true,borderWidth:1.7,pointRadius:0,tension:.15,spanGaps:false}]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+Number(c.raw).toFixed(1)+' mm/hr'}}},scales:{x:{ticks:{maxTicksLimit:5,color:'#51534c',font:{size:10}},grid:{display:false}},y:{beginAtZero:true,title:{display:true,text:'mm/hr',color:'#51534c',font:{size:10}},ticks:{color:'#51534c',font:{size:10}},grid:{color:'rgba(60,60,55,.10)'}}}}});
 const pressure=rows.map(r=>num(r.pressure_relative_hpa)).filter(v=>v!==null),pmin=pressure.length?Math.floor(Math.min(...pressure)-2):980,pmax=pressure.length?Math.ceil(Math.max(...pressure)+2):1040;
 new Chart($('brw-pressure-chart'),{type:'line',data:{labels,datasets:[{data:rows.map(r=>num(r.pressure_relative_hpa)),borderColor:'#5f6658',borderWidth:1.7,pointRadius:0,tension:.2,spanGaps:false}]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+Number(c.raw).toFixed(1)+' hPa'}}},scales:{x:{ticks:{maxTicksLimit:5,color:'#51534c',font:{size:10}},grid:{display:false}},y:{min:pmin,max:pmax,title:{display:true,text:'hPa',color:'#51534c',font:{size:10}},ticks:{color:'#51534c',font:{size:10}},grid:{color:'rgba(60,60,55,.10)'}}}}});
}catch(e){console.error('Brambley intraday charts:',e)}

/* Historical temperatures: meteorologically intuitive warm/cool palette. */
try{const old=Chart.getChart($('brw-temp-chart'));if(old){const colors=['#a43b32','#d28a3a','#5683a6','#315b85'];old.data.datasets.forEach((d,i)=>{d.borderColor=colors[i];d.backgroundColor=colors[i];});old.update();}}catch(e){console.error('Temperature palette:',e)}

/* Monthly rainfall: NOAA 1991-2020 precipitation normal, Hoquiam Bowerman Airport USW00094225.
   Values are inches from NOAA converted to mm. */
try{
 const ch=Chart.getChart($('brw-rain-chart'));
 if(ch){
   const normalIn=[10.91,6.65,7.74,5.35,2.99,2.01,0.85,1.35,2.53,6.91,10.95,10.52];
   const normal=normalIn.map(v=>v*25.4);
   const vals=ch.data.labels.map(x=>normal[Number(String(x).slice(5,7))-1]);
   const existing=ch.data.datasets.find(d=>d.label==='NOAA normal (1991–2020)');
   const ds={type:'line',label:'NOAA normal (1991–2020)',data:vals,borderColor:'#7b6048',backgroundColor:'#7b6048',borderDash:[7,5],pointRadius:0,borderWidth:2.2,spanGaps:false};
   if(existing)Object.assign(existing,ds);else ch.data.datasets.push(ds);
   ch.update();
   const section=$('brw-rain-chart').closest('.brw-section'),p=section?.querySelector('.brw-sectionhead p'),note=section?.querySelector('.brw-note');
   if(p)p.textContent='Observed monthly rainfall compared with the Brambley site average and NOAA’s 1991–2020 climate normal.';
   if(note)note.textContent='NOAA normal: Hoquiam Bowerman Airport, 1991–2020 U.S. Climate Normals. The Brambley comparison remains the 2020–2025 site average.';
 }
}catch(e){console.error('NOAA rainfall normal:',e)}

/* Solar: remove duplicate current values, put high/low cards above graph, and remove redundant seasonal heading/copy. */
try{
 const solar=root.querySelector('.brw-solar'),grid=solar?.querySelector('.brw-solargrid'),history=solar?.querySelector('.brw-solarhistory'),seasonal=solar?.querySelector('.brw-seasonal');
 if(grid)grid.remove();
 if(history&&seasonal)history.before(seasonal);
 const seasonalHead=seasonal?.querySelector('.brw-subhead');if(seasonalHead)seasonalHead.remove();
 const daily=history?.querySelector('.brw-subhead small');if(daily){daily.style.color='#4f6238';daily.style.opacity='1';}
}catch(e){console.error('Solar layout:',e)}
})();
</script>
