name: Backfill Weather Archive

on:
  push:
    branches: [main]
    paths:
      - scripts/backfill_archive.py
      - .github/workflows/backfill-archive.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build historical daily files
        run: python scripts/backfill_archive.py
      - name: Commit archive files
        run: |
          git config user.name "brambley-weather-bot"
          git config user.email "brambley-weather-bot@users.noreply.github.com"
          git add data/historical/daily/2021.csv data/historical/daily/2022.csv data/historical/daily/2023.csv data/historical/daily/2024.csv
          if git diff --cached --quiet; then
            echo "Archive already backfilled"
          else
            git commit -m "weather: backfill 2021-2024 daily archive"
            git push
          fi
