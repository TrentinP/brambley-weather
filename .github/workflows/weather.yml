name: Collect Brambley Weather

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/weather.yml"
      - "requirements.txt"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brambley-weather-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect latest Ambient Weather observation
        env:
          AMBIENT_API_KEY: ${{ secrets.AMBIENT_API_KEY }}
          AMBIENT_APPLICATION_KEY: ${{ secrets.AMBIENT_APPLICATION_KEY }}
          AMBIENT_DEVICE_MAC: ${{ secrets.AMBIENT_DEVICE_MAC }}
        run: python scripts/collect_weather.py

      - name: Commit updated weather data
        run: |
          if git diff --quiet -- data/; then
            echo "No new observation to commit."
            exit 0
          fi

          git config user.name "brambley-weather-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "weather: update observations"
          git push
